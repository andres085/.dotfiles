# Backend for transparency
backend = "xrender";

# Transparency settings
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 0.8;

# Opacity rules
opacity-rule = [
    "90:class_g = 'Alacritty'"
];

# Shadows (optional)
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.5;

# Fading (optional)
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
