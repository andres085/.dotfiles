# Backend for transparency
backend = "glx";
glx-no-stencil = true;
use-damage = false;

# Transparency settings
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 0.8;

# Shadows (optional)
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.5;

# Fading (optional)
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
